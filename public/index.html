<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danilão: Love vs Hate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">

  <!-- 2. jogo -->
  <section class="screen" id="screen-game">
    <div class="top">
      <h1 id="petName">Danilão<small id="petKind">love vs hate</small></h1>
      <button class="credits" id="creditsBtn" type="button" aria-label="Comprar créditos"><span class="coin"></span><span id="credits">0</span><span class="plus">+</span></button>
      <button class="icon-btn" id="mute" type="button" aria-pressed="false">Som</button>
    </div>

    <div class="tug" aria-label="Placar: bem contra mal">
      <span class="side b" id="tugB">0</span>
      <div class="rope"><div class="fb"></div><div class="fr"></div><div class="knot" id="knot"></div></div>
      <span class="side r" id="tugR">0</span>
    </div>

    <div id="stage" aria-label="Palco">
      <div id="bubble" role="status" aria-live="polite"></div>
      <div class="win" id="win" hidden></div>
      <div id="cat" aria-label="Danilão, de terno azul e chapéu de palha">
        <div class="char">
          <img class="art" src="img/danilao.webp" alt="Danilão, de terno azul e chapéu de palha" draggable="false">
          <svg class="fxlayer" viewBox="0 0 1024 1536" aria-hidden="true">
            <ellipse class="hotface" cx="510" cy="720" rx="250" ry="215" fill="#ff2a1a"/>
            <g class="cream">
              <path d="M270 590 Q510 500 750 590 Q790 760 720 860 Q700 940 650 900 Q620 980 580 900 Q540 990 500 900 Q460 960 420 890 Q380 930 350 860 Q250 770 270 590Z" fill="#fff8ee"/>
              <circle cx="510" cy="560" r="30" fill="#d6304a"/>
              <path d="M330 640 Q400 610 470 640 M560 640 Q630 610 700 640" stroke="#e8dcc6" stroke-width="10" fill="none" stroke-linecap="round"/>
            </g>
            <g class="stars" fill="#ffd84a">
              <path transform="translate(390 210) scale(4)" d="M0-8 L2.400-2.400 L8-2.400 L3.400 1.200 L5 7 L0 3.600 L-5 7 L-3.400 1.200 L-8-2.400 L-2.400-2.400Z"/>
              <path transform="translate(520 170) scale(4)" d="M0-8 L2.400-2.400 L8-2.400 L3.400 1.200 L5 7 L0 3.600 L-5 7 L-3.400 1.200 L-8-2.400 L-2.400-2.400Z"/>
              <path transform="translate(650 210) scale(4)" d="M0-8 L2.400-2.400 L8-2.400 L3.400 1.200 L5 7 L0 3.600 L-5 7 L-3.400 1.200 L-8-2.400 L-2.400-2.400Z"/>
            </g>
            <g class="steam" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round">
              <path d="M170 760 q-30 -40 0 -80 q30 -40 0 -80"/>
              <path d="M860 760 q-30 -40 0 -80 q30 -40 0 -80"/>
              <path d="M520 520 q-30 -40 0 -80"/>
            </g>
          </svg>
          <div class="zone z-hat" data-zone="hat"></div>
          <div class="zone z-head" data-zone="head" id="face"></div>
          <div class="zone z-body" data-zone="body"></div>
          <div id="mouthPt"></div>
        </div>
      </div>
    </div>

    <section class="panel" aria-label="Itens">
      <div id="items"></div>
    </section>
  </section>
</main>

<div class="modal" id="shop" hidden role="dialog" aria-modal="true" aria-labelledby="shopTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="shopTitle">Comprar créditos</h2><button class="icon-btn" id="shopClose" type="button">Fechar</button></div>
    <p class="demo" id="shopNote">Pagamento seguro pelo Stripe, com cartão ou Pix.</p>
    <div class="packs" id="packs"></div>
    <button class="link" id="recoverBtn" type="button">Já tenho um código de recuperação</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
