<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danilão: Love vs Hate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">

  <!-- 2. jogo -->
  <section class="screen" id="screen-game">
    <div class="top">
      <h1 id="petName">Danilão<small id="petKind">love vs hate</small></h1>
      <button class="credits" id="creditsBtn" type="button" aria-label="Comprar créditos"><span class="coin"></span><span id="credits">0</span><span class="plus">+</span></button>
      <button class="icon-btn" id="mute" type="button" aria-pressed="false">Som</button>
    </div>

    <div class="tug" aria-label="Placar global: Love contra Hate">
      <span class="side b" id="tugB">0</span>
      <div class="rope"><div class="fb"></div><div class="fr"></div><div class="knot" id="knot"></div></div>
      <span class="side r" id="tugR">0</span>
    </div>
    <div class="mine" id="mine" aria-live="off"></div>

    <div id="stage" aria-label="Palco">
      <div id="bubble" role="status" aria-live="polite"></div>
      <div class="win" id="win" hidden></div>
      <div id="cat" aria-label="Danilão, de terno azul e chapéu de palha">
        <div class="char">
          <img class="art" src="img/danilao.webp" alt="Danilão, de terno azul e chapéu de palha" draggable="false">
          <svg class="fxlayer" viewBox="0 0 1024 1536" aria-hidden="true">
            <defs><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>

            <!-- FELIZ (Love à frente): bochechas, sorriso, olhos fechados de alegria -->
            <g class="mood lg1">
              <circle cx="345" cy="790" r="46" fill="#ff6f8e" opacity=".38" filter="url(#soft)"/>
              <circle cx="675" cy="790" r="46" fill="#ff6f8e" opacity=".38" filter="url(#soft)"/>
            </g>
            <g class="mood lg2">
              <circle cx="345" cy="790" r="52" fill="#ff5a80" opacity=".3" filter="url(#soft)"/>
              <circle cx="675" cy="790" r="52" fill="#ff5a80" opacity=".3" filter="url(#soft)"/>
              <path d="M440 812 Q510 880 580 812" stroke="#7a2020" stroke-width="12" fill="none" stroke-linecap="round"/>
            </g>
            <g class="mood lg3">
              <path d="M425 800 Q510 930 595 800 Q510 826 425 800Z" fill="#7a1f1f" stroke="#5a1212" stroke-width="6" stroke-linejoin="round"/>
              <path d="M450 806 Q510 828 570 806 L564 826 Q510 844 456 826Z" fill="#fff"/>
              <ellipse cx="400" cy="654" rx="72" ry="70" fill="#fbb789"/>
              <ellipse cx="625" cy="654" rx="72" ry="70" fill="#fbb789"/>
              <path d="M335 674 Q400 596 465 674" stroke="#3a2418" stroke-width="16" fill="none" stroke-linecap="round"/>
              <path d="M560 674 Q625 596 690 674" stroke="#3a2418" stroke-width="16" fill="none" stroke-linecap="round"/>
              <g class="twinkle" fill="#fff6a8">
                <path transform="translate(300 520) scale(1.6)" d="M0-14 L3.500-3.500 L14 0 L3.500 3.500 L0 14 L-3.500 3.500 L-14 0 L-3.500-3.500Z"/>
                <path transform="translate(720 540) scale(1.3)" d="M0-14 L3.500-3.500 L14 0 L3.500 3.500 L0 14 L-3.500 3.500 L-14 0 L-3.500-3.500Z"/>
                <path transform="translate(255 800) scale(1.1)" d="M0-14 L3.500-3.500 L14 0 L3.500 3.500 L0 14 L-3.500 3.500 L-14 0 L-3.500-3.500Z"/>
                <path transform="translate(775 820) scale(1.4)" d="M0-14 L3.500-3.500 L14 0 L3.500 3.500 L0 14 L-3.500 3.500 L-14 0 L-3.500-3.500Z"/>
              </g>
            </g>

            <!-- MACHUCADO (Hate à frente): roxos, band-aid, olhos roxos, curativo no nariz -->
            <g class="mood hg1">
              <ellipse cx="335" cy="815" rx="44" ry="30" fill="#6b3a9e" opacity=".6" filter="url(#soft)"/>
              <path d="M690 780 L735 815 M700 765 L748 798" stroke="#c0392b" stroke-width="7" stroke-linecap="round" opacity=".85"/>
            </g>
            <g class="mood hg2">
              <ellipse cx="625" cy="668" rx="82" ry="72" fill="#4a1d78" opacity=".6" filter="url(#soft)" style="mix-blend-mode:multiply"/>
              <g transform="rotate(-24 360 770)"><rect x="312" y="752" width="96" height="36" rx="10" fill="#f2cf9c" stroke="#d9a96a" stroke-width="3"/><rect x="342" y="752" width="36" height="36" fill="#e7b97a" opacity=".6"/></g>
              <path d="M455 870 Q510 835 565 870" stroke="#7a2e2e" stroke-width="12" fill="none" stroke-linecap="round" opacity="0"/>
              <ellipse cx="510" cy="905" rx="46" ry="26" fill="#5b3294" opacity=".5" filter="url(#soft)"/>
            </g>
            <g class="mood hg3">
              <ellipse cx="400" cy="668" rx="82" ry="72" fill="#4a1d78" opacity=".6" filter="url(#soft)" style="mix-blend-mode:multiply"/>
              <ellipse cx="510" cy="740" rx="270" ry="215" fill="#6a2aa0" opacity=".2" style="mix-blend-mode:multiply"/>
              <g transform="rotate(-12 510 722)"><rect x="440" y="700" width="140" height="40" rx="10" fill="#f6f2ea" stroke="#d6cfc2" stroke-width="3"/></g>
              <g transform="rotate(48 510 722)"><rect x="440" y="704" width="130" height="34" rx="10" fill="#f6f2ea" stroke="#d6cfc2" stroke-width="3"/></g>
              <path d="M675 660 l22 -26 M700 664 l22 -26" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/>
              <path d="M445 862 Q510 805 575 862" stroke="#5a1212" stroke-width="12" fill="none" stroke-linecap="round"/>
            </g>
            <ellipse class="hotface" cx="510" cy="720" rx="250" ry="215" fill="#ff2a1a"/>
            <g class="cream">
              <path d="M270 590 Q510 500 750 590 Q790 760 720 860 Q700 940 650 900 Q620 980 580 900 Q540 990 500 900 Q460 960 420 890 Q380 930 350 860 Q250 770 270 590Z" fill="#fff8ee"/>
              <circle cx="510" cy="560" r="30" fill="#d6304a"/>
              <path d="M330 640 Q400 610 470 640 M560 640 Q630 610 700 640" stroke="#e8dcc6" stroke-width="10" fill="none" stroke-linecap="round"/>
            </g>
            <g class="stars" fill="#ffd84a">
              <path transform="translate(390 210) scale(4)" d="M0-8 L2.400-2.400 L8-2.400 L3.400 1.200 L5 7 L0 3.600 L-5 7 L-3.400 1.200 L-8-2.400 L-2.400-2.400Z"/>
              <path transform="translate(520 170) scale(4)" d="M0-8 L2.400-2.400 L8-2.400 L3.400 1.200 L5 7 L0 3.600 L-5 7 L-3.400 1.200 L-8-2.400 L-2.400-2.400Z"/>
              <path transform="translate(650 210) scale(4)" d="M0-8 L2.400-2.400 L8-2.400 L3.400 1.200 L5 7 L0 3.600 L-5 7 L-3.400 1.200 L-8-2.400 L-2.400-2.400Z"/>
            </g>
            <g class="steam" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round">
              <path d="M170 760 q-30 -40 0 -80 q30 -40 0 -80"/>
              <path d="M860 760 q-30 -40 0 -80 q30 -40 0 -80"/>
              <path d="M520 520 q-30 -40 0 -80"/>
            </g>
          </svg>
          <div class="zone z-hat" data-zone="hat"></div>
          <div class="zone z-head" data-zone="head" id="face"></div>
          <div class="zone z-body" data-zone="body"></div>
          <div id="mouthPt"></div>
        </div>
      </div>
    </div>

    <section class="panel" aria-label="Itens">
      <div id="items"></div>
    </section>
  </section>
</main>

<div class="modal" id="shop" hidden role="dialog" aria-modal="true" aria-labelledby="shopTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="shopTitle">Comprar créditos</h2><button class="icon-btn" id="shopClose" type="button">Fechar</button></div>
    <p class="demo" id="shopNote">Pagamento seguro pelo Stripe, com cartão ou Pix.</p>
    <div class="packs" id="packs"></div>
    <button class="link" id="recoverBtn" type="button">Já tenho um código de recuperação</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
