<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bigodes, o Bicho de Terno</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">

  <!-- 1. escolher o bicho -->
  <section class="screen pick" id="screen-animal">
    <div>
      <h2>Escolha seu bichinho</h2>
      <p>Ele usa terno e gravata e depende de você.</p>
    </div>
    <div class="cards" id="animalCards"></div>
  </section>

  <!-- 2. jogo -->
  <section class="screen" id="screen-game" hidden>
    <div class="top">
      <button class="icon-btn" id="back" type="button">Trocar</button>
      <h1 id="petName">Bigodes<small id="petKind">gato de terno</small></h1>
      <button class="credits" id="creditsBtn" type="button" aria-label="Comprar créditos"><span class="coin"></span><span id="credits">0</span><span class="plus">+</span></button>
      <button class="icon-btn" id="mute" type="button" aria-pressed="false">Som</button>
    </div>

    <div class="tug" aria-label="Placar: bem contra mal">
      <span class="side b" id="tugB">0</span>
      <div class="rope"><div class="fb"></div><div class="fr"></div><div class="knot" id="knot"></div></div>
      <span class="side r" id="tugR">0</span>
    </div>

    <div id="stage" aria-label="Palco">
      <div class="window"></div>
      <div id="bubble" role="status" aria-live="polite"></div>
      <div class="win" id="win" hidden></div>
      <svg id="cat" viewBox="0 0 300 340" preserveAspectRatio="xMidYMax meet" data-animal="cat" aria-label="Bichinho de terno e gravata vermelha">
        <ellipse cx="150" cy="334" rx="95" ry="8" fill="#000" opacity=".18"/>

        <path class="tail t-cat" d="M212 292 C272 292 286 232 254 198" stroke-width="20"/>
        <path class="tail t-dog" d="M212 292 C252 290 266 250 250 218" stroke-width="18"/>
        <path class="tail t-pig" d="M214 298 C244 298 250 274 234 270 C220 267 218 284 232 284" stroke-width="7" style="stroke:#ee8fa5"/>

        <g id="body-g">
          <g id="body-hit">
            <path d="M78 340 L78 252 Q78 206 150 206 Q222 206 222 252 L222 340 Z" fill="#232a3d"/>
            <path d="M130 208 L170 208 L150 266 Z" fill="#f7f4ee"/>
            <path d="M126 208 L150 266 L112 250 Z" fill="#313a55"/>
            <path d="M174 208 L150 266 L188 250 Z" fill="#313a55"/>
            <path d="M143 220 L157 220 L160 246 L150 282 L140 246 Z" fill="#c0392b"/>
            <rect x="143" y="214" width="14" height="11" rx="3" fill="#a52f23"/>
            <ellipse class="fur" cx="102" cy="322" rx="15" ry="12"/>
            <ellipse class="fur" cx="198" cy="322" rx="15" ry="12"/>
          </g>

          <!-- cabeça de gato -->
          <g class="head-g h-cat">
            <path d="M80 92 L76 30 L126 68 Z" fill="#f0954a"/>
            <path d="M220 92 L224 30 L174 68 Z" fill="#f0954a"/>
            <path d="M88 82 L86 48 L113 68 Z" fill="#f4a9a0"/>
            <path d="M212 82 L214 48 L187 68 Z" fill="#f4a9a0"/>
            <ellipse cx="150" cy="128" rx="78" ry="66" fill="#f0954a"/>
            <path d="M150 64 L150 88 M132 68 L136 88 M168 68 L164 88" stroke="#c9722e" stroke-width="6" stroke-linecap="round"/>
            <ellipse cx="150" cy="154" rx="40" ry="29" fill="#fbe3c7"/>
            <g class="eyes">
              <g class="eye"><ellipse cx="120" cy="118" rx="15" ry="18" fill="#fff"/><g class="pupil"><circle cx="120" cy="120" r="9" fill="#1a1a24"/><circle cx="123" cy="115" r="3" fill="#fff"/></g></g>
              <g class="eye"><ellipse cx="180" cy="118" rx="15" ry="18" fill="#fff"/><g class="pupil"><circle cx="180" cy="120" r="9" fill="#1a1a24"/><circle cx="183" cy="115" r="3" fill="#fff"/></g></g>
            </g>
            <g class="blush"><circle cx="98" cy="146" r="11" fill="#f08a8a" opacity=".75"/><circle cx="202" cy="146" r="11" fill="#f08a8a" opacity=".75"/></g>
            <path d="M143 139 L157 139 L150 148 Z" fill="#e0707f"/>
            <path class="mouth" d="M134 158 Q142 167 150 158 Q158 167 166 158" fill="none" stroke="#6b3a2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M108 150 L66 142 M108 156 L64 160 M192 150 L234 142 M192 156 L236 160" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
          </g>

          <!-- cabeça de cachorro -->
          <g class="head-g h-dog">
            <ellipse cx="80" cy="112" rx="24" ry="46" transform="rotate(14 80 112)" fill="#7a4b2a"/>
            <ellipse cx="220" cy="112" rx="24" ry="46" transform="rotate(-14 220 112)" fill="#7a4b2a"/>
            <ellipse cx="150" cy="128" rx="76" ry="66" fill="#b9824f"/>
            <ellipse cx="150" cy="96" rx="13" ry="34" fill="#f6e7d0"/>
            <ellipse cx="150" cy="156" rx="42" ry="29" fill="#f6e7d0"/>
            <g class="eyes">
              <g class="eye"><ellipse cx="118" cy="116" rx="14" ry="17" fill="#fff"/><g class="pupil"><circle cx="118" cy="118" r="9" fill="#1a1a24"/><circle cx="121" cy="113" r="3" fill="#fff"/></g></g>
              <g class="eye"><ellipse cx="182" cy="116" rx="14" ry="17" fill="#fff"/><g class="pupil"><circle cx="182" cy="118" r="9" fill="#1a1a24"/><circle cx="185" cy="113" r="3" fill="#fff"/></g></g>
            </g>
            <g class="blush"><circle cx="96" cy="148" r="11" fill="#f08a8a" opacity=".7"/><circle cx="204" cy="148" r="11" fill="#f08a8a" opacity=".7"/></g>
            <ellipse cx="150" cy="142" rx="14" ry="10" fill="#2a2a33"/>
            <ellipse cx="146" cy="139" rx="4" ry="2.500" fill="#fff" opacity=".6"/>
            <path class="mouth" d="M134 158 Q142 167 150 158 Q158 167 166 158" fill="none" stroke="#5a3322" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- cabeça de porco -->
          <g class="head-g h-pig">
            <path d="M84 86 L64 44 L114 68 Z" fill="#ee8fa5"/>
            <path d="M216 86 L236 44 L186 68 Z" fill="#ee8fa5"/>
            <ellipse cx="150" cy="128" rx="80" ry="66" fill="#f4a5b5"/>
            <g class="eyes">
              <g class="eye"><ellipse cx="114" cy="110" rx="13" ry="16" fill="#fff"/><g class="pupil"><circle cx="114" cy="112" r="8" fill="#1a1a24"/><circle cx="117" cy="107" r="2.800" fill="#fff"/></g></g>
              <g class="eye"><ellipse cx="186" cy="110" rx="13" ry="16" fill="#fff"/><g class="pupil"><circle cx="186" cy="112" r="8" fill="#1a1a24"/><circle cx="189" cy="107" r="2.800" fill="#fff"/></g></g>
            </g>
            <g class="blush"><circle cx="92" cy="140" r="11" fill="#e8607e" opacity=".6"/><circle cx="208" cy="140" r="11" fill="#e8607e" opacity=".6"/></g>
            <ellipse cx="150" cy="148" rx="32" ry="22" fill="#f08fa3"/>
            <ellipse cx="140" cy="148" rx="4.500" ry="7" fill="#b04a63"/>
            <ellipse cx="160" cy="148" rx="4.500" ry="7" fill="#b04a63"/>
            <path class="mouth" d="M134 158 Q142 167 150 158 Q158 167 166 158" fill="none" stroke="#8a3a4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- efeitos: estrelas (tonto) e fedor (enjoado) -->
          <g class="stars" fill="#ffd84a">
            <path transform="translate(112 40)" d="M0-8 L2.400-2.400 L8-2.400 L3.400 1.200 L5 7 L0 3.600 L-5 7 L-3.400 1.200 L-8-2.400 L-2.400-2.400Z"/>
            <path transform="translate(150 22)" d="M0-8 L2.400-2.400 L8-2.400 L3.400 1.200 L5 7 L0 3.600 L-5 7 L-3.400 1.200 L-8-2.400 L-2.400-2.400Z"/>
            <path transform="translate(188 40)" d="M0-8 L2.400-2.400 L8-2.400 L3.400 1.200 L5 7 L0 3.600 L-5 7 L-3.400 1.200 L-8-2.400 L-2.400-2.400Z"/>
          </g>
          <g class="stink" fill="none" stroke="#8fbf3a" stroke-width="3" stroke-linecap="round">
            <path d="M70 70 q-8 -10 0 -20 q8 -10 0 -20"/>
            <path d="M230 70 q-8 -10 0 -20 q8 -10 0 -20"/>
            <path d="M150 34 q-8 -10 0 -20"/>
          </g>
        </g>
        <text id="zzz" x="206" y="70">Z z z</text>
      </svg>
    </div>

    <section class="panel" aria-label="Loja de itens">
      <div id="items"></div>
    </section>
  </section>
</main>

<div class="modal" id="shop" hidden role="dialog" aria-modal="true" aria-labelledby="shopTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="shopTitle">Comprar créditos</h2><button class="icon-btn" id="shopClose" type="button">Fechar</button></div>
    <p class="demo" id="shopNote">Pagamento seguro pelo Stripe, com cartão ou Pix.</p>
    <div class="packs" id="packs"></div>
    <button class="link" id="recoverBtn" type="button">Já tenho um código de recuperação</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
